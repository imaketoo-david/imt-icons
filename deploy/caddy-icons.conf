	# ── IMT Icons (정적 호스팅) ─────────────────────────────
	# 기존 Caddyfile 의 :8080 블록 안, `handle { respond "unknown host" 404 }` 바로 위에 붙여넣기
	@icons host icons.imaketoo.com
	handle @icons {
		root * /Users/songsmac-mini/Documents/Project/imt-icons
		header {
			# 크로스 오리진에서 웹폰트·JSON·SVG 를 쓰기 위해 필요
			Access-Control-Allow-Origin "*"
			Access-Control-Allow-Methods "GET, OPTIONS"
		}
		@immutable path /icons/* /font/* /sprite.svg /icons.json
		header @immutable Cache-Control "public, max-age=31536000, immutable"
		header /catalog.html Cache-Control "no-cache"
		try_files {path} /catalog.html
		file_server
	}

# ── IMT Icons 정적 호스팅 ─────────────────────────────────────
# 위치: 맥미니 /opt/homebrew/etc/Caddyfile  (PM2 프로세스명 "caddy")
#       :8080 블록 안, 캐치올 `handle { respond "unknown host" 404 }` 바로 위
# 적용: caddy validate --config /opt/homebrew/etc/Caddyfile --adapter caddyfile
#       caddy reload   --config /opt/homebrew/etc/Caddyfile --adapter caddyfile
@icons host icons.imaketoo.com
handle @icons {
	root * /Users/songsmac-mini/Documents/Project/imt-icons
	header {
		Access-Control-Allow-Origin "*"
		Access-Control-Allow-Methods "GET, OPTIONS"
	}
	@iroot path /
	redir @iroot /catalog.html
	@istatic path /icons/* /font/* /sprite.svg /icons.json
	header @istatic Cache-Control "public, max-age=604800"
	file_server
}
